    <script>
        const form = document.getElementById('verificationForm');
        const usernameInput = document.getElementById('username');
        const submitButton = document.getElementById('submitButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const successNotification = document.getElementById('successNotification');
        const errorNotification = document.getElementById('errorNotification');
        const reportModal = document.getElementById('reportModal');
        const reportText = document.getElementById('reportText');
        const charCounter = document.getElementById('charCounter');
        const successPopup = document.getElementById('successPopup');
        const submitReportBtn = document.getElementById('submitReport');

        
        const WORKER_URL = "agent-check.carding-hub99.workers.dev";

        const detailsContainer = successNotification.querySelector(".notification-details");

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            let username = usernameInput.value.trim();

            if (!username) {
                return;
            }

            if (username.startsWith("@")) {
                username = username.slice(1);
            }

            username = username.toLowerCase();

            setLoading(true);

            let result = null;
            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username })
                });
                result = await res.json();
            } catch (err) {
                result = null;
            }

            setLoading(false);

            if (result && result.success) {
                const agent = result.agent;
                detailsContainer.innerHTML = `
                    <div><strong>Telegram:</strong> ${agent.telegram}</div>
                    <div><strong>License No.:</strong> ${agent.license}</div>
                    <div><strong>Agent Name:</strong> ${agent.name}</div>
                    <div><strong>Escrow Mode:</strong> ${agent.mode}</div>
                    <div><strong>Successful Trades:</strong> ${agent.trades}</div>
                    <div><strong>License For:</strong> ${agent.licenseFor}</div>
                `;
                showNotification('success');
            } else {
                showNotification('error');
            }
        });

        function setLoading(isLoading) {
            submitButton.disabled = isLoading;

            if (isLoading) {
                buttonText.textContent = 'Verifying...';
                loadingSpinner.classList.remove('hidden');
            } else {
                buttonText.textContent = 'Verify Agent';
                loadingSpinner.classList.add('hidden');
            }
        }

        function showNotification(type) {
            hideNotification('success');
            hideNotification('error');

            const notification = type === 'success' ? successNotification : errorNotification;
            notification.classList.remove('hidden');

            const delay = type === 'success' ? 10000 : 8000;
            setTimeout(() => hideNotification(type), delay);
        }

        function hideNotification(type) {
            const notification = type === 'success' ? successNotification : errorNotification;
            notification.classList.add('hidden');
        }

        function openReportModal() {
            reportModal.classList.remove('hidden');
            reportText.value = '';
            updateCharCounter();
        }

        function cancelReport() {
            reportModal.classList.add('hidden');
            resetToMainPage();
        }

        function submitReport() {
            const text = reportText.value.trim();

            if (text.length === 0) {
                return;
            }

            reportModal.classList.add('hidden');
            successPopup.classList.remove('hidden');

            setTimeout(() => {
                successPopup.classList.add('hidden');
                resetToMainPage();
            }, 2500);
        }

        function resetToMainPage() {
            hideNotification('success');
            hideNotification('error');
            usernameInput.value = '';
            reportText.value = '';
        }

        reportText.addEventListener('input', updateCharCounter);

        function updateCharCounter() {
            const length = reportText.value.length;
            charCounter.textContent = `${length.toLocaleString()} / 10,000 characters`;

            if (length === 10000) {
                charCounter.classList.add('warning');
            } else {
                charCounter.classList.remove('warning');
            }

            submitReportBtn.disabled = length === 0;
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.notification-card') && !e.target.closest('#submitButton')) {
                hideNotification('success');
                hideNotification('error');
            }
        });
    </script>
